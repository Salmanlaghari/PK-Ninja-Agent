# ── PK Ninja Agent — Docker Compose ─────────────────────────────────────
# Production-ready compose with reverse proxy, health checks, and volumes.
#
# Usage:
#   docker compose up -d            # start all services
#   docker compose logs -f app      # follow app logs
#   docker compose down             # stop and remove
#   docker compose down -v          # also remove volumes
# ────────────────────────────────────────────────────────────────────────

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pk-ninja-agent
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - app-data:/app/data
      - app-workspaces:/app/workspaces
      - app-logs:/app/logs
    healthcheck:
      test: ["CMD", "python3", "-c", "import httpx; r = httpx.get('http://localhost:8000/health'); r.raise_for_status()"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - pk-ninja

  nginx:
    image: nginx:alpine
    container_name: pk-ninja-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - pk-ninja

volumes:
  app-data:
    driver: local
  app-workspaces:
    driver: local
  app-logs:
    driver: local

networks:
  pk-ninja:
    driver: bridge
