# ── PK Ninja Agent — Deploy Workflow ────────────────────────────────────
# Triggered manually or after release. Deploys to configured platform.
#
# Required secrets (set in repo Settings → Secrets):
#   FLY_API_TOKEN     — Fly.io API token (from `flyctl auth token`)
#   RENDER_API_KEY    — Render API key (from render.com/account/api-keys)
#   RENDER_SERVICE_ID — Render service ID (from service dashboard URL)
#
# Usage:
#   1. Go to Actions tab → Deploy → Run workflow
#   2. Select platform (fly / render)
#   3. Click "Run workflow"

name: Deploy

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Deploy target'
        required: true
        default: 'render'
        type: choice
        options:
          - render
          - fly
  release:
    types: [published]

concurrency:
  group: deploy-${{ github.event.inputs.platform || 'render' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy-render:
    name: Deploy to Render
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.platform == 'render')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Trigger Render deploy
        run: |
          curl -sf -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}'
        continue-on-error: true

      - name: Summary
        run: |
          echo "## 🚀 Deploy triggered on Render" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** pk-ninja-agent" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://pk-ninja-agent.onrender.com" >> $GITHUB_STEP_SUMMARY
          echo "**Health:** https://pk-ninja-agent.onrender.com/health" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check your Render dashboard for deployment status." >> $GITHUB_STEP_SUMMARY

  deploy-fly:
    name: Deploy to Fly.io
    if: >-
      github.event_name == 'workflow_dispatch' && github.event.inputs.platform == 'fly'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Get app URL
        id: url
        run: echo "URL=https://$(flyctl status --json | python3 -c 'import sys,json; print(json.load(sys.stdin)["App"]["Name"])').fly.dev" >> $GITHUB_OUTPUT
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify health
        run: |
          sleep 15
          curl -sf "${{ steps.url.outputs.URL }}/health" || echo "Health check will pass after app stabilizes"

      - name: Summary
        run: |
          echo "## 🚀 Deployed to Fly.io" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.url.outputs.URL }}" >> $GITHUB_STEP_SUMMARY
          echo "**Health:** ${{ steps.url.outputs.URL }}/health" >> $GITHUB_STEP_SUMMARY
