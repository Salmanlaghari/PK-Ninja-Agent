# ── PK Ninja Agent — CI Pipeline ────────────────────────────────────────
# Runs on every push and PR to main/develop branches.
# Tests, linting, security audit, and Docker build verification.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Run tests
        run: python -m pytest --tb=short -q --junitxml=test-results.xml
        env:
          AI_PROVIDER: local
          GITHUB_TOKEN: ""

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results.xml

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Dependency audit (pip-audit)
        run: pip-audit --strict --desc

      - name: Security scan (bandit)
        run: bandit -r backend/ agents/ providers/ -c pyproject.toml || true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t pk-ninja-agent:test .

      - name: Verify container starts
        run: |
          docker run --rm -d --name pk-test -p 8000:8000 \
            -e AI_PROVIDER=local \
            -e GITHUB_TOKEN="" \
            pk-ninja-agent:test
          sleep 10
          curl -sf http://localhost:8000/health || (docker logs pk-test && exit 1)
          docker stop pk-test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Check syntax
        run: ruff check backend/ agents/ providers/ --select E,F,W --ignore E501
